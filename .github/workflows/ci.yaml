name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    frontend-tests:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              run: npm ci

            - name: Run frontend component tests
              run: npm run test:run

            - name: Build frontend
              run: npm run build

    backend-tests:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: backend

        services:
            postgres:
                image: postgres:16

                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: savnac_test

                ports:
                    - 5432:5432

                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine

                ports:
                    - 6379:6379

                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/savnac_test?schema=public
            REDIS_URL: redis://localhost:6379
            RESEND_API_KEY: re_test_ci_key

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install backend dependencies
              run: npm ci

            - name: Generate Prisma client
              run: npx prisma generate

            - name: Apply Prisma migration
              run: npx prisma migrate deploy

            - name: Run backend integration tests
              run: npm run test:integration

            - name: Build backend
              run: npm run build
